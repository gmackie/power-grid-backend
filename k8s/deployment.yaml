apiVersion: apps/v1
kind: Deployment
metadata:
  name: power-grid-backend
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: power-grid-backend
  template:
    metadata:
      labels:
        app: power-grid-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: server
        image: ci.gmac.io/mackieg/power-grid-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 4080
          name: websocket
        env:
        - name: PORT
          value: "4080"
        - name: ENV
          value: "production"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 4080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 4080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: power-grid-backend
  namespace: production
spec:
  selector:
    app: power-grid-backend
  ports:
  - port: 4080
    targetPort: 4080
    name: websocket
  type: ClusterIP