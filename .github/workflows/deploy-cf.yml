name: Deploy Power Grid server to Cloudflare

on:
  push:
    branches: [master, main]
    paths: ["cf_server/**", ".github/workflows/deploy-cf.yml"]
  pull_request:
    paths: ["cf_server/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cf_server } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: cf_server/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:workers

  # Deploy is manual for now: the production Worker also serves the React bundle (web-dist/),
  # which is built from the sibling react_client checkout that is not in this repository.
  # Run `pnpm build:web <react_client> && pnpm deploy` from cf_server/ instead.
  deploy:
    needs: test
    if: false
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cf_server } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: cf_server/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - name: Apply D1 migrations
        run: pnpm db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy
        run: pnpm deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
